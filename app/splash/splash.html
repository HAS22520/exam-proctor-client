<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>在线监考客户端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      overflow: hidden;
      padding: 30px;
      position: relative;
    }
    .shield-box {
      width: 64px;
      height: 64px;
      background: rgba(14, 165, 233, 0.12);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(56, 189, 248, 0.25); }
      50% { transform: scale(1.04); box-shadow: 0 0 32px rgba(56, 189, 248, 0.45); }
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #f1f5f9;
      display: flex;
      align-items: center;
    }
    .version-tag {
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
    }
    .status-text {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 14px;
      margin-bottom: 12px;
      text-align: center;
      height: 20px;
      transition: color 0.2s ease;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    .progress-bar.indeterminate {
      width: 40%;
      position: absolute;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -40%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 40%; }
    }
    .footer {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="shield-box">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      <polyline points="9 12 11 14 15 10"></polyline>
    </svg>
  </div>
  <div class="title">
    在线监考客户端
    <span class="version-tag" id="version-label">v1.0.0</span>
  </div>
  <div class="status-text" id="status-label">正在初始化安全环境...</div>
  <div class="progress-track">
    <div class="progress-bar indeterminate" id="progress-bar"></div>
  </div>
  <div class="footer">考场安全防护系统 · 自动远端策略同步</div>

  <script>
    if (window.splashAPI && window.splashAPI.onStatus) {
      window.splashAPI.onStatus((data) => {
        const statusLabel = document.getElementById('status-label');
        const progressBar = document.getElementById('progress-bar');
        const versionLabel = document.getElementById('version-label');

        if (data.version) {
          versionLabel.textContent = `v${data.version}`;
        }
        if (data.message) {
          statusLabel.textContent = data.message;
        }
        if (typeof data.percent === 'number' && data.percent >= 0) {
          progressBar.classList.remove('indeterminate');
          progressBar.style.width = `${Math.min(100, Math.max(0, data.percent))}%`;
        } else {
          progressBar.classList.add('indeterminate');
          progressBar.style.width = '';
        }
      });
    }
  </script>
</body>
</html>
